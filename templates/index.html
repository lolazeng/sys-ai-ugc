<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>AI Video Platform</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 900px; margin: 30px auto; }
    textarea { width: 100%; height: 180px; }
    .box { border: 1px solid #ddd; border-radius: 10px; padding: 16px; margin-bottom: 16px; }
    button { padding: 10px 16px; }
    pre { background: #f8f8f8; padding: 12px; border-radius: 8px; overflow-x: auto; }
  </style>
</head>
<body>
  <h1>Kling Clip Platform</h1>
  <div class="box">
    <form id="genForm">
      <label><b>Upload base image</b></label><br/><br/>
      <input type="file" name="image_file" accept="image/*" required /><br/><br/>

      <label><b>Paste full script</b></label><br/><br/>
      <textarea name="script" required placeholder="Paste full script..."></textarea><br/><br/>

      <button type="submit">Generate</button>
    </form>
  </div>

  <div class="box">
    <h3>Status</h3>
    <div id="status">Idle</div>
    <pre id="out"></pre>
  </div>

  <script>
    const form = document.getElementById('genForm');
    const out = document.getElementById('out');
    const status = document.getElementById('status');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      status.textContent = 'Running...';
      out.textContent = '';

      const fd = new FormData(form);
      const res = await fetch('/generate', { method: 'POST', body: fd });
      const data = await res.json();

      status.textContent = data.ok ? 'Done' : 'Failed';
      out.textContent = JSON.stringify(data, null, 2);

      if (data.ok && data.final_video) {
        const p = document.createElement('p');
        const a = document.createElement('a');
        a.href = data.final_video;
        a.target = '_blank';
        a.textContent = 'Download final stitched video';
        p.appendChild(a);
        document.body.appendChild(p);
      }
    });
  </script>
</body>
</html>
